<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打标效果预览 - autoannotation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/front/style.css?v=20260331b">
</head>
<body>
<div id="app">
    <header class="topbar">
        <div class="topbar-left">
            <div class="topbar-logo">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h18"/><circle cx="15" cy="15" r="2"/></svg>
            </div>
            <h1>打标效果对照</h1>
        </div>
        <div class="topbar-right">
            <span id="previewSubTitle" class="muted-text" style="color:#9CA3AF">加载中...</span>
            <a class="btn-link minor" href="/" style="color:#D1D5DB;border-color:rgba(255,255,255,0.15)">
                <span class="icon"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span>
                返回
            </a>
        </div>
    </header>

    <main class="main-content">
        <section class="card">
            <h2>筛选与下载</h2>
            <p class="help-text">每张卡片按"原图 / Overlay / AI绘图SVG / 提取Mask / 标签TXT"五列展示。</p>
            <div class="form-row inline preview-toolbar">
                <div>
                    <label>文件名关键字</label>
                    <input type="text" id="keyword" placeholder="例如 frame_0001">
                </div>
                <div>
                    <label>仅看有框样本</label>
                    <label class="check-item">
                        <input type="checkbox" id="onlyWithBoxes">
                        <span>final_boxes > 0</span>
                    </label>
                </div>
                <div class="actions align-end">
                    <button id="btnSearch" class="primary">筛选</button>
                </div>
            </div>
            <div id="downloads" class="artifacts"></div>
            <div id="summary" class="status-box">读取中...</div>
        </section>

        <section class="card" style="margin-top:12px">
            <div class="actions">
                <button id="btnPrev" class="minor">
                    <span class="icon"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></span>
                    上一页
                </button>
                <button id="btnNext" class="minor">
                    下一页
                    <span class="icon" style="margin-right:0;margin-left:5px"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
                </button>
                <span id="pagerText" class="muted-text"></span>
            </div>
            <div id="previewGrid" class="preview-grid"></div>
        </section>
    </main>
</div>
<!-- Lightbox -->
<div id="lightbox" class="lightbox hidden" onclick="closeLightbox(event)">
  <img id="lightboxImg" src="" alt="放大预览">
</div>
<script>
function openLightbox(src) {
  var box = document.getElementById("lightbox");
  var img = document.getElementById("lightboxImg");
  if (!box || !img || !src) return;
  img.src = src;
  box.classList.remove("hidden");
  document.body.style.overflow = "hidden";
}
function closeLightbox(ev) {
  if (ev && ev.target && ev.target.id === "lightboxImg") return;
  var box = document.getElementById("lightbox");
  if (!box) return;
  box.classList.add("hidden");
  document.getElementById("lightboxImg").src = "";
  document.body.style.overflow = "";
}
document.addEventListener("keydown", function(ev) { if (ev.key === "Escape") closeLightbox(); });
document.addEventListener("click", function(ev) {
  if (ev.target.tagName !== "IMG") return;
  var s = window.getComputedStyle(ev.target);
  if (s.cursor === "zoom-in") { ev.preventDefault(); openLightbox(ev.target.src); }
});
</script>
<script src="/front/ui_utils.js?v=20260425a"></script>
<script src="/front/preview.js?v=20260425b"></script>
</body>
</html>
